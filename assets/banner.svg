<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="RÚZ MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#152544"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- decorative bar-chart motif -->
  <g opacity="0.16">
    <rect x="880"  y="188" width="34" height="52"  rx="5" fill="#38bdf8"/>
    <rect x="926"  y="158" width="34" height="82"  rx="5" fill="#38bdf8"/>
    <rect x="972"  y="120" width="34" height="120" rx="5" fill="#7dd3fc"/>
    <rect x="1018" y="140" width="34" height="100" rx="5" fill="#818cf8"/>
    <rect x="1064" y="86"  width="34" height="154" rx="5" fill="#a5b4fc"/>
  </g>
  <polyline points="897,176 943,146 989,104 1035,126 1081,72"
            fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" opacity="0.85"/>
  <g fill="#e0f2fe">
    <circle cx="897"  cy="176" r="5"/><circle cx="943" cy="146" r="5"/>
    <circle cx="989"  cy="104" r="5"/><circle cx="1035" cy="126" r="5"/>
    <circle cx="1081" cy="72"  r="5.5"/>
  </g>

  <rect x="72" y="74" width="5" height="132" rx="2.5" fill="url(#accent)"/>

  <text x="104" y="126" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="-1">RÚZ MCP Server</text>
  <text x="106" y="166" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" fill="#94a3b8">Register účtovných závierok SR ako MCP nástroj</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <rect x="106" y="188" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155"/>
    <text x="123" y="208" fill="#7dd3fc">8 nástrojov</text>
    <rect x="266" y="188" width="132" height="30" rx="15" fill="#1e293b" stroke="#334155"/>
    <text x="283" y="208" fill="#a5b4fc">stdio + HTTP</text>
    <rect x="408" y="188" width="164" height="30" rx="15" fill="#1e293b" stroke="#334155"/>
    <text x="425" y="208" fill="#86efac">otvorené dáta</text>
  </g>
</svg>
